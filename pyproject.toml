[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-slack-sections"
version = "0.1.0"
description = "Local-first explicit Linear issue/project status to native personal Slack sections"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
linear-slack-sections = "linear_slack_sections.cli:main"

[tool.setuptools.packages.find]
include = ["linear_slack_sections*"]
